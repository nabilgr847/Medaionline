# MedAI Hospital — Render Blueprint for the FREE plan.
# Use this one if you do not want to pay for a persistent disk: the API works fully,
# but uploaded files live in /tmp and are lost on every deploy/restart.
services:
  - type: web
    name: medai-hospital-v2-api
    runtime: node
    rootDir: apps/api
    plan: free
    buildCommand: apt-get update && apt-get install -y poppler-utils && npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_RECOVERY_KEY
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://medaionline-1.onrender.com
      - key: APP_PUBLIC_URL
        value: https://medaionline-1.onrender.com
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_FROM
        value: MedAI Hospital <no-reply@medaihospital.app>
      - key: REQUIRE_ADMIN_APPROVAL
        value: "false"
  - type: web
    name: medai-hospital-v2-web
    runtime: static
    rootDir: apps/web
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: medai-hospital-v2-api
          property: host
