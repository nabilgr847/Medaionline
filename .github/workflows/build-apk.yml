name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build web app for local bundling
        working-directory: apps/web
        run: |
          npm install
          npm run build
          rm -rf ../mobile/www
          cp -r dist ../mobile/www

      - name: Create Android project
        working-directory: apps/mobile
        run: |
          npm install
          npx cap add android
          python3 scripts/patch_android.py
          npx cap sync android

      - name: Build APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk MedAI-Hospital.apk
          gh release delete apk-latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create apk-latest MedAI-Hospital.apk --repo "${{ github.repository }}" \
            --title "MedAI Hospital Android APK" \
            --notes "MedAI Hospital for Android.

* Fingerprint / face unlock: turn it on in Security, then reopen the app and unlock with your finger instead of the password (re-locks after 2 minutes in the background).
* Medicine tracker: add reminders, log each dose as taken or skipped, and watch your adherence score.
* The whole web app is bundled inside the APK, so the interface opens instantly even on a slow connection.
* Camera, microphone, gallery, file download and print all use the native Android bridge.

Download MedAI-Hospital.apk and install (allow install from unknown sources when Android asks)."

      - uses: actions/upload-artifact@v4
        with:
          name: MedAI-Hospital-apk
          path: MedAI-Hospital.apk
