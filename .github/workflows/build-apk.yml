name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

# Only one build may publish the release at a time; a second run waits.
concurrency:
  group: apk-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build web app for local bundling
        working-directory: apps/web
        # The bundle is frozen into the APK, so the API URL has to be present at
        # build time. Without it every screen inside the app fails with
        # "The MedAI API URL is not configured". Override with the repository
        # variable MEDAI_API_URL if the API ever moves.
        env:
          VITE_API_URL: ${{ vars.MEDAI_API_URL || 'https://medaionline.onrender.com' }}
        run: |
          npm install
          npm run build
          rm -rf ../mobile/www
          cp -r dist ../mobile/www

      - name: Verify the bundled app points at the API
        env:
          VITE_API_URL: ${{ vars.MEDAI_API_URL || 'https://medaionline.onrender.com' }}
        run: |
          host="${VITE_API_URL#https://}"; host="${host#http://}"; host="${host%%/*}"
          echo "Expecting API host in bundle: $host"
          if ! grep -rqF "$host" apps/mobile/www/assets; then
            echo "::error::The APK bundle does not contain $host — the app would not be able to sign in."
            exit 1
          fi
          if grep -rqF "The MedAI API URL is not configured" apps/mobile/www/assets/index-*.js && [ -z "$host" ]; then
            echo "::error::Bundle built without an API URL."
            exit 1
          fi
          if ! grep -q "nativeShell" apps/mobile/www/index.html; then
            echo "::warning::index.html no longer guards the service worker; it may serve a stale app inside the APK."
          fi
          echo "Bundle check passed."

      - name: Create Android project
        working-directory: apps/mobile
        run: |
          npm install
          npx cap add android
          python3 scripts/patch_android.py
          npx cap sync android

      - name: Build APKs
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          # Both build types are signed with the key committed in apps/mobile/medai-release.jks.
          # A release APK is the normal download; the debug one is a fallback if a phone's
          # installer dislikes it (some OEM installers do).
          ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Verify both APKs
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          REL=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          DBG=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          for APK in "$REL" "$DBG"; do
            test -f "$APK" || { echo "::error::$APK was not produced"; exit 1; }
            echo "=== $APK ($(stat -c%s "$APK") bytes) ==="
            "$BT/apksigner" verify --verbose --print-certs "$APK" | tee -a /tmp/certs.txt
            "$BT/apksigner" verify "$APK" >/dev/null || { echo "::error::$APK is not correctly signed"; exit 1; }
            "$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|application-label:)" || true
          done
          "$BT/aapt2" dump badging "$REL" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)" > /tmp/badging.txt || true
          cat /tmp/badging.txt

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          REPO="${{ github.repository }}"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          REL=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          DBG=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          cp "$REL" MedAI-Hospital.apk
          cp "$DBG" MedAI-Hospital-debug.apk
          sha256sum MedAI-Hospital.apk MedAI-Hospital-debug.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

          REL_SIZE=$(stat -c%s MedAI-Hospital.apk)
          DBG_SIZE=$(stat -c%s MedAI-Hospital-debug.apk)
          REL_SHA=$(sha256sum MedAI-Hospital.apk | cut -d' ' -f1)
          CODE=$(grep -o "versionCode='[0-9]*'" /tmp/badging.txt | head -1 | tr -dc 0-9)
          MIN=$(grep -o "sdkVersion:'[0-9]*'" /tmp/badging.txt | head -1 | tr -dc 0-9)
          ABIS=$(grep -o "native-code: .*" /tmp/badging.txt | head -1 || true)
          SIGNER=$("$BT/apksigner" verify --print-certs MedAI-Hospital.apk | grep -m1 "certificate DN" | sed 's/.*DN: //' || true)

          cat > INSTALL.txt <<EOF
          MedAI Hospital - Android install help
          =====================================
          Build:        ${{ github.run_number }}
          Package:      com.medai.hospital
          versionCode:  $CODE
          Minimum:      Android $MIN (API $MIN)
          ABIs:         $ABIS
          Signed by:    $SIGNER
          APK size:     $REL_SIZE bytes
          APK sha256:   $REL_SHA

          1) Preferred file: MedAI-Hospital.apk
             If Android says "app not installed" or "invalid package", try
             MedAI-Hospital-debug.apk - same app, different packaging.

          2) Check the download before installing: the file must be exactly
             $REL_SIZE bytes. A smaller file is an incomplete download
             (open the link in Chrome, not inside another app).

          3) An older MedAI build signed with a different key blocks the update.
             Uninstall "MedAI Hospital" first, then install this file.

          4) Android 6.0 or newer is required.
          EOF

          {
            echo ""
            echo "## Download"
            echo ""
            echo "| File | Size | Use it when |"
            echo "| --- | --- | --- |"
            echo "| \`MedAI-Hospital.apk\` | $REL_SIZE bytes | normal install (recommended) |"
            echo "| \`MedAI-Hospital-debug.apk\` | $DBG_SIZE bytes | the phone rejects the release build |"
            echo ""
            echo "- versionCode \`$CODE\`, minimum Android API \`$MIN\`, signed by $SIGNER"
            echo "- sha256 \`$REL_SHA\` (see \`SHA256SUMS.txt\`; check details in \`INSTALL.txt\`)"
            echo "- \"Invalid package\" almost always means an incomplete download: the file must be"
            echo "  exactly $REL_SIZE bytes. Download it in Chrome, then open it from Downloads."
            echo "- Updating an older MedAI build? Uninstall it once, then install this file."
          } >> apps/mobile/RELEASE_NOTES_ANDROID.md

          gh release delete apk-latest --yes --cleanup-tag --repo "$REPO" || true
          for i in 1 2 3; do
            if gh release view apk-latest --repo "$REPO" >/dev/null 2>&1; then sleep 3; else break; fi
          done
          gh release create apk-latest MedAI-Hospital.apk MedAI-Hospital-debug.apk SHA256SUMS.txt INSTALL.txt \
            --repo "$REPO" \
            --title "MedAI Hospital Android APK" \
            --notes-file apps/mobile/RELEASE_NOTES_ANDROID.md

      - name: Prove the uploaded file is intact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p /tmp/roundtrip
          gh release download apk-latest --pattern "MedAI-Hospital.apk" --dir /tmp/roundtrip --clobber --repo "${{ github.repository }}"
          LOCAL=$(sha256sum MedAI-Hospital.apk | cut -d' ' -f1)
          REMOTE=$(sha256sum /tmp/roundtrip/MedAI-Hospital.apk | cut -d' ' -f1)
          echo "local=$LOCAL"
          echo "remote=$REMOTE"
          [ "$LOCAL" = "$REMOTE" ] || { echo "::error::the published APK differs from the built one (corrupt upload)"; exit 1; }
          echo "Published APK verified byte-for-byte."

      - uses: actions/upload-artifact@v4
        with:
          name: MedAI-Hospital-apk
          path: MedAI-Hospital.apk
